; PlatformIO project for the Carbon Tracker ESP32 + PZEM-004T node.
;
; Build:  pio run
; Flash:  pio run --target upload
; Serial: pio device monitor
;
; Copy include/secrets.example.h to include/secrets.h and fill in your
; Firebase + WiFi credentials before building.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<main.cpp>
lib_deps =
  mobizt/FirebaseClient@^2.2.13
  tzapu/WiFiManager@^2.0.17
  mandulaj/PZEM-004T-v30@^1.1.2

[env:test_hw]
build_src_filter = -<*> +<test_hw.cpp>
lib_deps =
  mandulaj/PZEM-004T-v30@^1.1.2
